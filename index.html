    <script type="module">
      const observer = lozad();
      observer.observe();

      import { JustifiedGrid } from 'https://cdn.skypack.dev/@egjs/grid';
      const options = {
        gap: 12,
        columnRange: [ 5 ,  5 ],
        sizeRange: [ 400 , Infinity],
      };
      const contenidor = document.querySelector(".section-images-section-2");
      // Guardem totes les fotos amb la mida original, abans que la graella les modifiqui
      const totesLesFotos = [...contenidor.querySelectorAll(":scope > .foto")];
      totesLesFotos.forEach(f => f.dataset.mida = f.getAttribute("style"));

      // Si l'última fila no és completa, la graella l'estira a tota l'amplada i les fotos
      // queden enormes. Aquí la tornem a l'alçada de la fila anterior.
      function ajustaUltimaFila() {
        const fotos = [...contenidor.children];
        const files = new Map();
        fotos.forEach(f => {
          const top = Math.round(parseFloat(f.style.top) || 0);
          if (!files.has(top)) files.set(top, []);
          files.get(top).push(f);
        });
        const tops = [...files.keys()].sort((a, b) => a - b);
        if (tops.length < 2) return;
        const ultima = files.get(tops[tops.length - 1]);
        const anterior = files.get(tops[tops.length - 2]);
        if (ultima.length >= anterior.length) return;
        const alcadaBona = parseFloat(anterior[0].style.height);
        const alcadaUltima = parseFloat(ultima[0].style.height);
        // Si la fila s'ha estirat, la tornem a l'alçada de la fila anterior
        const escala = alcadaUltima > alcadaBona ? alcadaBona / alcadaUltima : 1;
        const alcada = alcadaUltima * escala;
        ultima.sort((a, b) => parseFloat(a.style.left) - parseFloat(b.style.left));
        const amplades = ultima.map(f => parseFloat(f.style.width) * escala);
        // Centrem la fila dins l'amplada de la graella
        const total = amplades.reduce((s, w) => s + w, 0) + options.gap * (ultima.length - 1);
        let esquerra = Math.max(0, (contenidor.clientWidth - total) / 2);
        ultima.forEach((f, i) => {
          f.style.width = amplades[i] + "px";
          f.style.height = alcada + "px";
          f.style.left = esquerra + "px";
          esquerra += amplades[i] + options.gap;
        });
        contenidor.style.height = (tops[tops.length - 1] + alcada) + "px";
      }
      function creaGraella() {
        const g = new JustifiedGrid(contenidor, options);
        g.on("renderComplete", ajustaUltimaFila);
        g.renderItems();
        return g;
      }

      let graella = null;

      const botons = document.querySelectorAll(".filtres button");
      const estils = [...botons].map(b => b.dataset.filtre);
      function filtra(estil) {
        botons.forEach(b => b.classList.toggle("actiu", b.dataset.filtre === estil));
        const visibles = totesLesFotos.filter(f => f.dataset.estil === estil);
        if (graella) graella.destroy({ preserveUI: true });
        visibles.forEach(f => f.setAttribute("style", f.dataset.mida));
        contenidor.removeAttribute("style");
        contenidor.replaceChildren(...visibles);
        graella = creaGraella();
        observer.observe();
      }
      botons.forEach(b => b.addEventListener("click", () => filtra(b.dataset.filtre)));

      // En obrir la web es mostra una secció a l'atzar.
      // Un enllaç directe (p. ex. index.html#platja) obre aquella secció.
      const demanat = location.hash.slice(1);
      const inicial = estils.includes(demanat)
        ? demanat
        : estils[Math.floor(Math.random() * estils.length)];
      filtra(inicial);

      import PhotoSwipeLightbox from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe-lightbox.esm.min.js';
      import PhotoSwipe from 'https://cdnjs.cloudflare.com/ajax/libs/photoswipe/5.4.4/photoswipe.esm.min.js';
      

      const lightboxOptions = {
        pswpModule: PhotoSwipe,
        gallery: '.section-images',
        children: 'a',
        padding: { top: 20, bottom: 20, left: 20, right: 20 },
        bgOpacity: 1
      };
      
        lightboxOptions.arrowPrev =  true ;
        lightboxOptions.arrowNext =  true ;
        lightboxOptions.zoom =  true ;
        lightboxOptions.close =  true ;
        lightboxOptions.counter =  true ;
      
      const lightbox = new PhotoSwipeLightbox(lightboxOptions);
      
      lightbox.init();
    </script>
